version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dra_postgres
    environment:
      POSTGRES_DB: disaster_response
      POSTGRES_USER: dra_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dra_secure_2024}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dra_admin -d disaster_response"]
      interval: 10s
      timeout: 5s
      retries: 5

